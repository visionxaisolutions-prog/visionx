<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Work — VisionXAI</title>
<meta name="description" content="VisionXAI's portfolio is coming soon — stay tuned for our upcoming website, photography and videography projects.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>

:root{
  --primary:#FF6A00; --primary-light:#FFB36B; --primary-soft:#FFE6D6; --accent-dark:#E65100;
  --grad-a:#FF8A33; --grad-b:#FF6A00;
  --bg:#FFF7F2; --surface:#FFFFFF; --surface-soft:#FFF2EB; --surface-hover:#FFEDE2;
  --text:#1A1A1A; --gray-dark:#4B4B4B; --gray-med:#8F8F8F; --gray-light:#D9D9D9;
  --radius:18px; --maxw:1280px;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth; overflow-x:hidden;}
body{margin:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; overflow-x:hidden;}
h1,h2,h3,.brand{font-family:'Poppins',sans-serif;}
a{color:inherit; text-decoration:none;}
img,svg{display:block; max-width:100%;}
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 32px; position:relative;}
:focus-visible{outline:2px solid var(--accent-dark); outline-offset:3px; border-radius:4px;}

header{position:sticky; top:0; z-index:100; background:rgba(255,247,242,0.88); backdrop-filter:blur(10px); border-bottom:1px solid var(--gray-light);}
.nav-row{display:flex; align-items:center; justify-content:space-between; padding:16px 0;}
.brand{font-weight:800; font-size:21px; letter-spacing:0.5px; color:var(--text); display:flex; flex-direction:column; line-height:1.05;}
.brand .name{white-space:nowrap;}
.brand .x{color:var(--primary);}
.brand small{font-family:'Inter',sans-serif; font-size:9px; font-weight:600; letter-spacing:3px; color:var(--gray-med); margin-top:3px;}
nav.links{display:flex; gap:30px; align-items:center; font-size:15px; font-weight:600; letter-spacing:0.3px;}
nav.links a{color:var(--gray-dark); padding-bottom:4px; border-bottom:2px solid transparent; transition:color .2s, border-color .2s;}
nav.links a:hover{color:var(--primary);}
nav.links a.active{color:var(--primary); border-color:var(--primary);}
.btn{display:inline-flex; align-items:center; gap:8px; font-size:15px; font-weight:700; letter-spacing:0.4px; padding:14px 26px; border-radius:10px; cursor:pointer; border:none; transition:transform .18s ease, box-shadow .18s ease, background .18s ease; white-space:nowrap;}
.btn-primary{background:linear-gradient(135deg,var(--grad-a),var(--grad-b)); color:#fff; border:1px solid transparent; box-shadow:0 8px 20px -8px rgba(255,106,0,0.55);}
.btn-primary:hover{transform:translateY(-2px); box-shadow:0 12px 24px -8px rgba(255,106,0,0.6);}
.btn-outline{background:transparent; color:var(--text); border:1.5px solid var(--gray-light);}
.btn-outline:hover{border-color:var(--primary); color:var(--primary); transform:translateY(-2px);}
.btn-outline.on-dark{color:#fff; border-color:rgba(255,255,255,0.5);}
.btn-outline.on-dark:hover{border-color:#fff; color:#fff; background:rgba(255,255,255,0.08);}
.nav-cta{font-size:14.5px; padding:12px 22px; border:1.5px solid var(--primary); color:var(--primary); border-radius:10px; font-weight:700;}
.nav-cta:hover{background:var(--primary); color:#fff;}
.menu-toggle{display:none; background:none; border:none; cursor:pointer; padding:6px;}
.menu-toggle span{display:block; width:24px; height:2px; background:var(--text); margin:5px 0; border-radius:2px;}

/* Generic page hero (no globe) used on inner pages */
.page-hero{position:relative; padding:64px 0 56px; overflow:hidden;}
.page-hero .decor{position:absolute; top:-40px; right:-60px; width:520px; opacity:0.9; z-index:0; pointer-events:none;}
.page-hero .decor svg{width:100%; height:auto;}
.page-hero-content{position:relative; z-index:2; max-width:680px;}
.eyebrow{color:var(--primary); font-weight:700; font-size:14px; letter-spacing:1.4px; text-transform:uppercase; margin-bottom:16px;}
h1.headline{font-size:clamp(36px,4.6vw,56px); font-weight:800; line-height:1.1; letter-spacing:-1px; margin:0 0 20px;}
h1.headline .accent{color:var(--primary);}
.sub{font-size:18px; line-height:1.65; color:var(--gray-dark); max-width:560px; margin:0 0 8px;}
.hero-ctas{display:flex; gap:16px; flex-wrap:wrap; margin-top:26px;}

/* Feature-card grid (reused on Home) */
.feature-card{position:relative; z-index:4; background:var(--surface); border-radius:24px; box-shadow:0 40px 80px -30px rgba(230,81,0,0.22), 0 4px 20px rgba(0,0,0,0.04); display:grid; grid-template-columns:repeat(4,1fr); padding:8px;}
.feature{padding:30px 26px; border-right:1px solid var(--gray-light); transition:background .2s; border-radius:16px;}
.feature:last-child{border-right:none;}
.feature:hover{background:var(--surface-soft);}
.feature .icon{width:46px; height:46px; border-radius:11px; border:1.5px solid var(--primary-soft); background:var(--surface-soft); display:flex; align-items:center; justify-content:center; margin-bottom:16px; color:var(--primary);}
.feature h3{font-size:17.5px; font-weight:700; margin:0 0 9px;}
.feature p{font-size:14.5px; line-height:1.6; color:var(--gray-med); margin:0;}

.pulse{animation:pulse 2.6s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.55; transform:scale(1.6);}}
@media (prefers-reduced-motion: reduce){.pulse{animation:none;} *{scroll-behavior:auto !important;}}

/* Section utility */
.section{padding:70px 0;}
.section-head{max-width:640px; margin:0 0 44px;}
.section-head .eyebrow{margin-bottom:14px;}
.section-head h2{font-size:clamp(28px,3.2vw,38px); font-weight:800; letter-spacing:-0.5px; margin:0 0 14px; line-height:1.15;}
.section-head p{font-size:16.5px; color:var(--gray-dark); line-height:1.6; margin:0;}

/* CTA band */
.cta-band{background:linear-gradient(135deg,#FFF2EB,#FFE6D6); border:1px solid var(--primary-soft); border-radius:24px; padding:50px 48px; display:flex; align-items:center; justify-content:space-between; gap:24px; flex-wrap:wrap;}
.cta-band h3{font-size:26px; font-weight:800; margin:0 0 6px;}
.cta-band p{margin:0; color:var(--gray-dark); font-size:15.5px;}

footer{margin-top:64px; border-top:1px solid var(--gray-light); padding:26px 0; position:relative; z-index:2; background:var(--bg);}
.footer-row{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px;}
.footer-row p{font-size:13px; color:var(--gray-med); margin:0;}
.socials{display:flex; gap:10px;}
.socials a{width:36px; height:36px; border-radius:9px; border:1.5px solid var(--primary); color:var(--primary); display:flex; align-items:center; justify-content:center; transition:background .2s, color .2s;}
.socials a:hover{background:var(--primary); color:#fff;}

@media (max-width:980px){
  .page-hero .decor{width:360px; top:-20px; right:-100px; opacity:0.6;}
  .feature-card{grid-template-columns:repeat(2,1fr);}
  .feature{border-right:1px solid var(--gray-light);}
  .feature:nth-child(2n){border-right:none;}
  .feature:nth-child(n+3){border-top:1px solid var(--gray-light);}
  .cta-band{padding:36px 30px;}
}
@media (max-width:760px){
  nav.links{position:fixed; inset:64px 16px auto 16px; background:var(--surface); border:1px solid var(--gray-light); border-radius:14px; padding:18px; flex-direction:column; align-items:flex-start; gap:14px; box-shadow:0 20px 40px -20px rgba(0,0,0,0.25); display:none;}
  nav.links.open{display:flex;}
  .menu-toggle{display:block;}
  .nav-cta{display:none;}
  .wrap{padding:0 20px;}
  .feature-card{grid-template-columns:1fr;}
  .feature{border-right:none !important; border-top:1px solid var(--gray-light);}
  .feature:first-child{border-top:none;}
  .page-hero{padding:44px 0 36px;}
  .page-hero .decor{display:none;}
  .section{padding:48px 0;}
}


.work-hero{padding:70px 0 90px;}
.work-grid{display:grid; grid-template-columns:1fr 1fr; gap:40px; align-items:center;}
.work-visual{max-width:460px; margin:0 auto;}
.work-visual svg{width:100%; height:auto;}
@media (max-width:980px){
  .work-grid{grid-template-columns:1fr; text-align:center;}
  .work-visual{order:-1;}
  .page-hero-content{margin:0 auto;}
  .hero-ctas{justify-content:center;}
}
